<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">FreeRTOS Multi-Task Architecture (ESP32)</text>

  <!-- Hardware column -->
  <text x="90" y="70" text-anchor="middle" font-size="13" fill="#555">HARDWARE</text>
  <rect x="30" y="85" width="120" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="90" y="112" text-anchor="middle" font-size="14">DHT22</text>
  <text x="90" y="130" text-anchor="middle" font-size="11" fill="#555">GPIO15</text>

  <rect x="30" y="250" width="120" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="90" y="277" text-anchor="middle" font-size="14">OLED SSD1306</text>
  <text x="90" y="295" text-anchor="middle" font-size="11" fill="#555">I2C 21/22</text>

  <rect x="30" y="400" width="120" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="90" y="427" text-anchor="middle" font-size="14">Buzzer + LED</text>
  <text x="90" y="445" text-anchor="middle" font-size="11" fill="#555">GPIO18 / 19</text>

  <rect x="30" y="490" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="90" y="513" text-anchor="middle" font-size="14">Push Button</text>
  <text x="90" y="529" text-anchor="middle" font-size="11" fill="#555">GPIO4 (ISR)</text>

  <!-- Tasks -->
  <text x="450" y="70" text-anchor="middle" font-size="13" fill="#555">TASKS</text>
  <rect x="340" y="85" width="220" height="70" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" font-size="15" font-weight="bold">SensorTask</text>
  <text x="450" y="132" text-anchor="middle" font-size="12">Priority 2 | periodic 500 ms</text>
  <text x="450" y="146" text-anchor="middle" font-size="11" fill="#555">vTaskDelayUntil</text>

  <rect x="340" y="250" width="220" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="277" text-anchor="middle" font-size="15" font-weight="bold">DisplayTask</text>
  <text x="450" y="297" text-anchor="middle" font-size="12">Priority 1 | periodic 1000 ms</text>
  <text x="450" y="311" text-anchor="middle" font-size="11" fill="#555">vTaskDelayUntil</text>

  <rect x="340" y="395" width="220" height="70" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="450" y="422" text-anchor="middle" font-size="15" font-weight="bold">AlarmTask</text>
  <text x="450" y="442" text-anchor="middle" font-size="12">Priority 3 (highest) | event driven</text>
  <text x="450" y="456" text-anchor="middle" font-size="11" fill="#555">xTaskNotifyWait</text>

  <!-- Sync primitives -->
  <text x="780" y="70" text-anchor="middle" font-size="13" fill="#555">SYNCHRONIZATION</text>
  <rect x="680" y="170" width="200" height="50" rx="8" fill="#ede7f6" stroke="#4527a0"/>
  <text x="780" y="192" text-anchor="middle" font-size="13" font-weight="bold">displayQueue</text>
  <text x="780" y="208" text-anchor="middle" font-size="11">len 1, xQueueOverwrite</text>

  <rect x="680" y="85" width="200" height="50" rx="8" fill="#ede7f6" stroke="#4527a0"/>
  <text x="780" y="107" text-anchor="middle" font-size="13" font-weight="bold">dataMutex</text>
  <text x="780" y="123" text-anchor="middle" font-size="11">protects sharedData</text>

  <rect x="680" y="330" width="200" height="50" rx="8" fill="#ede7f6" stroke="#4527a0"/>
  <text x="780" y="352" text-anchor="middle" font-size="13" font-weight="bold">serialMutex</text>
  <text x="780" y="368" text-anchor="middle" font-size="11">protects Serial output</text>

  <!-- Arrows: hardware -> tasks -->
  <line x1="150" y1="115" x2="338" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="245" y="108" text-anchor="middle" font-size="11">read T / H</text>

  <line x1="338" y1="285" x2="152" y2="285" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="245" y="278" text-anchor="middle" font-size="11">draw readings</text>

  <line x1="338" y1="430" x2="152" y2="430" stroke="#c62828" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="245" y="423" text-anchor="middle" font-size="11">drive outputs</text>

  <polyline points="150,515 250,515 250,455 338,455" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="200" y="508" text-anchor="middle" font-size="11">ISR notify</text>

  <!-- Sensor -> Display via queue -->
  <line x1="450" y1="155" x2="450" y2="248" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="458" y="205" font-size="11">latest sample</text>
  <line x1="560" y1="185" x2="678" y2="195" stroke="#4527a0" stroke-dasharray="4 3"/>

  <!-- Sensor -> Alarm via notification -->
  <path d="M340,120 C290,120 290,380 340,415" fill="none" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="295" y="360" font-size="11" fill="#c62828" transform="rotate(-90 295 360)">T &gt; 40C : xTaskNotify</text>

  <!-- mutex links -->
  <line x1="560" y1="105" x2="678" y2="108" stroke="#4527a0" stroke-dasharray="4 3"/>
  <path d="M560,410 C620,300 640,150 678,125" fill="none" stroke="#4527a0" stroke-dasharray="4 3"/>
  <line x1="560" y1="270" x2="678" y2="350" stroke="#4527a0" stroke-dasharray="4 3"/>

  <text x="450" y="548" text-anchor="middle" font-size="11" fill="#555">Solid = data/control flow  |  Dashed = uses synchronization object  |  Red = emergency path</text>
</svg>
